name: Capital readiness

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: alphasignal
          POSTGRES_PASSWORD: alphasignal
          POSTGRES_DB: alphasignal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alphasignal -d alphasignal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_TEST_BYPASS: "1"
      TEST_DATABASE_URL: postgresql://alphasignal:alphasignal@127.0.0.1:5432/alphasignal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: node --check ibkr-bridge/bridge.js
      - run: npm run test:capital
      - run: npm run lifecycle
      - run: node ibkr-bridge/contract-resolution.test.js
