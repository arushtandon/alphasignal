<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AlphaSignal Login</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #17223d, #070a12 55%); color: #eef3ff; }
    main { width: min(92vw, 390px); padding: 32px; border: 1px solid #2d3d61; border-radius: 18px; background: rgba(14, 20, 35, .94); box-shadow: 0 24px 70px #0009; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    p { margin: 0 0 24px; color: #9facc6; }
    label { display: block; margin: 15px 0 7px; font-size: 13px; color: #c3cee4; }
    input { width: 100%; padding: 12px 13px; border: 1px solid #344668; border-radius: 9px; background: #0b1120; color: #fff; font: inherit; outline: none; }
    input:focus { border-color: #54a6ff; box-shadow: 0 0 0 3px #3286df25; }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 78px; }
    .show-password { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: #9facc6; font: 12px/1 Inter, system-ui, sans-serif; font-weight: 700; cursor: pointer; padding: 8px; width: auto; margin: 0; }
    .show-password:hover { color: #eef3ff; }
    button[type="submit"] { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 9px; background: #2d8cff; color: white; font-weight: 700; cursor: pointer; }
    button[type="submit"]:disabled { opacity: .55; cursor: wait; }
    #error { min-height: 20px; margin: 14px 0 -4px; color: #ff8790; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>AlphaSignal</h1>
    <p>Sign in to access the trading dashboard.</p>
    <form id="login">
      <label for="username">User ID</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="show-password" id="toggle-password" aria-pressed="false">Show</button>
      </div>
      <div id="error" role="alert"></div>
      <button type="submit">Sign in</button>
    </form>
  </main>
  <script>
    document.getElementById('toggle-password').addEventListener('click', () => {
      const input = document.getElementById('password');
      const button = document.getElementById('toggle-password');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      button.textContent = show ? 'Hide' : 'Show';
      button.setAttribute('aria-pressed', show ? 'true' : 'false');
    });
    document.getElementById('login').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = event.currentTarget.querySelector('button[type="submit"]');
      const error = document.getElementById('error');
      button.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || 'Unable to sign in');
        location.replace('/');
      } catch (err) {
        error.textContent = err.message || 'Unable to sign in';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
